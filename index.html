<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초간단 모바일 PC 연동</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background: #fafafa; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); text-align: center; }
        textarea { width: 100%; height: 180px; margin: 15px 0; padding: 12px; box-sizing: border-box; font-size: 16px; border: 2px solid #007bff; border-radius: 8px; resize: none; }
        .status { font-size: 14px; font-weight: bold; color: #28a745; }
        .info { font-size: 12px; color: #666; background: #eee; padding: 8px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📱 모바일 ⇄ 💻 PC 실시간 메모장</h2>
        <p class="info">동일한 고유 주소망을 통해 기기 간 글자가 무조건 동기화됩니다.</p>
        
        <textarea id="box" placeholder="여기에 아무 내용이나 타이핑해 보세요..."></textarea>
        
        <div class="status" id="statusText">● 실시간 연결망 연결 중...</div>
    </div>

    <script>
        // 전 세계 공용 무료 실시간 허브 채널 (오류 유발 요소를 제거한 로우 포맷 주소)
        const roomID = "sync_room_unique_998877"; // 중복 방지를 위한 나만의 방 이름
        const subscribeURL = `ntfy.sh{roomID}/raw`; // 가공 없는 원본 문자열 수신 경로
        const publishURL = `ntfy.sh{roomID}`;

        const eventSource = new EventSource(subscribeURL);
        const box = document.getElementById('box');
        const statusText = document.getElementById('statusText');
        let typingTimer;

        // 연결 시작 성공 알림
        eventSource.onopen = () => {
            statusText.innerText = "● 실시간 연결망 가동 중 (정상)";
            statusText.style.color = "#28a745";
        };

        // 1. 상대방 기기에서 입력된 순수 글자 데이터 수신 및 반영
        eventSource.onmessage = function(event) {
            // 다른 기기에서 보낸 데이터가 비어있지 않고, 내가 입력 중이 아닐 때만 화면 갱신
            if (document.activeElement !== box && event.data.trim() !== "") {
                box.value = event.data;
            }
        };

        // 2. 사용자가 글을 타이핑할 때 원시 문자열 서식으로 직접 전송
        box.addEventListener('input', (e) => {
            clearTimeout(typingTimer);
            statusText.innerText = "● 데이터 전송 중...";
            statusDiv.style.color = "#ff9500";
            
            typingTimer = setTimeout(() => {
                fetch(publishURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain; charset=utf-8' }, // 인코딩 규격 명시
                    body: e.target.value
                }).then(() => {
                    statusText.innerText = "● 실시간 연결망 가동 중 (정상)";
                    statusText.style.color = "#28a745";
                });
            }, 250); // 0.25초 디바운스로 통신 안정성 확보
        });
    </script>
</body>
</html>
