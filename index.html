<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초간단 모바일 PC 연동</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background: #fafafa; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); text-align: center; }
        textarea { width: 100%; height: 180px; margin: 15px 0; padding: 12px; box-sizing: border-box; font-size: 16px; border: 2px solid #007bff; border-radius: 8px; resize: none; }
        .status { font-size: 14px; font-weight: bold; color: #28a745; }
        .info { font-size: 12px; color: #666; background: #eee; padding: 8px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📱 모바일 ⇄ 💻 PC 실시간 메모장</h2>
        <p class="info">동일한 공용 채널을 통해 기기 간 글자가 즉시 동기화됩니다.</p>
        
        <textarea id="box" placeholder="여기에 아무 내용이나 타이핑해 보세요..."></textarea>
        
        <div class="status">● 실시간 연결망 가동 중 (정상)</div>
    </div>

    <script>
        // 전 세계 공용 무료 실시간 데이터 허브 채널 설정 (나만의 고유 주소로 자동 지정)
        const subscribeURL = "ntfy.sh";
        const publishURL = "ntfy.sh";
        
        // 브라우저 기본 기능으로 외부 서버 우회 차단망 가동
        const eventSource = new EventSource(subscribeURL);
        const box = document.getElementById('box');
        let typingTimer;

        // 1. 상대방 기기에서 글을 쓰면 내 화면에 실시간으로 글자 반영
        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            // 내가 지금 입력 창을 클릭해서 쓰고 있는 상태가 아닐 때만 덮어쓰기
            if (document.activeElement !== box && data.message) {
                box.value = data.message;
            }
        };

        // 2. 내가 글을 쓰면 즉시 서버를 거쳐 다른 기기로 텍스트 송신
        box.addEventListener('input', (e) => {
            clearTimeout(typingTimer);
            
            // 입력 도중 과부하를 막기 위해 타이핑이 0.2초 멈추면 전송
            typingTimer = setTimeout(() => {
                fetch(publishURL, {
                    method: 'POST',
                    body: JSON.stringify({ message: e.target.value })
                });
            }, 200);
        });
    </script>
</body>
</html>
