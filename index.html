<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이터 저장 및 확인</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background: #f5f5f7; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        h2 { margin-top: 0; font-size: 20px; color: #1d1d1f; }
        textarea { width: 100%; height: 150px; margin: 10px 0; padding: 12px; box-sizing: border-box; font-size: 16px; border: 1px solid #d2d2d7; border-radius: 8px; resize: none; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .btn-save { background: #0071e3; color: white; }
        .btn-load { background: #34c759; color: white; }
        .status { margin-top: 15px; font-size: 14px; color: #86868b; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>💻 PC 입력 ⇄ 📱 모바일 조회</h2>
        <p style="font-size: 13px; color: #6e6e73; margin-bottom: 15px;">PC에서 작성 후 [저장], 모바일에서 [새로 불러오기]를 누르세요.</p>
        
        <textarea id="mainText" placeholder="여기에 내용을 입력하세요..."></textarea>
        
        <div class="btn-group">
            <button class="btn-save" onclick="saveData()">💾 서버에 저장하기</button>
            <button class="btn-load" onclick="loadData()">🔄 새로 불러오기</button>
        </div>

        <div class="status" id="statusText">상태: 준비 완료</div>
    </div>

    <!-- 브라우저 보안을 타지 않는 공식 파이어베이스 REST API 통신 모듈 빌드 -->
    <script>
        // 이전에 발급받으신 파이어베이스 데이터베이스 싱가포르 주소 고정 적용
        const dbURL = "firebasedatabase.app";
        const textarea = document.getElementById('mainText');
        const statusText = document.getElementById('statusText');

        // 페이지가 처음 열릴 때 서버에 저장된 데이터를 자동으로 가져옵니다.
        window.onload = function() {
            loadData();
        };

        // 1. [저장하기] 버튼을 누르면 서버에 데이터를 안전하게 기록합니다 (PC용)
        function saveData() {
            statusText.innerText = "⏳ 서버에 저장 중...";
            statusText.style.color = "#ff9500";

            fetch(dbURL, {
                method: "PUT", // 데이터를 덮어쓰는 표준 규격
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: textarea.value })
            })
            .then(response => {
                if(response.ok) {
                    statusText.innerText = "✅ 서버 저장 완료!";
                    statusText.style.color = "#34c759";
                } else {
                    statusText.innerText = "❌ 저장 실패 (규칙 설정을 확인하세요)";
                    statusText.style.color = "#ff3b30";
                }
            })
            .catch(error => {
                statusText.innerText = "❌ 통신 오류: " + error.message;
                statusText.style.color = "#ff3b30";
            });
        }

        // 2. [새로 불러오기] 버튼을 누르면 서버에서 데이터를 읽어옵니다 (모바일용)
        function loadData() {
            statusText.innerText = "⏳ 최신 데이터 가져오는 중...";
            statusText.style.color = "#0071e3";

            fetch(dbURL)
            .then(response => response.json())
            .then(data => {
                if (data && data.text) {
                    textarea.value = data.text;
                    statusText.innerText = "✅ 최신 데이터 로드 완료";
                    statusText.style.color = "#34c759";
                } else {
                    textarea.value = "";
                    statusText.innerText = "ℹ️ 서버가 비어있습니다. 새 글을 저장하세요.";
                    statusText.style.color = "#86868b";
                }
            })
            .catch(error => {
                statusText.innerText = "❌ 데이터 로드 실패: " + error.message;
                statusText.style.color = "#ff3b30";
            });
        }
    </script>
</body>
</html>
