<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파이어베이스 실시간 연동 테스트</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background: #f5f5f7; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; font-size: 20px; color: #1d1d1f; }
        textarea { width: 100%; height: 150px; margin: 10px 0; padding: 12px; box-sizing: border-box; font-size: 16px; border: 1px solid #d2d2d7; border-radius: 8px; resize: none; }
        textarea:focus { border-color: #0071e3; outline: none; }
        .status { font-size: 14px; font-weight: bold; margin-top: 10px; color: #86868b; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📱 모바일 - 💻 PC 실시간 연동</h2>
        <p style="font-size: 14px; color: #6e6e73;">본인의 파이어베이스 서버를 거쳐 안전하게 동기화됩니다.</p>
        
        <textarea id="sharedText" placeholder="여기에 글을 입력하면 다른 기기에 실시간으로 나타납니다..."></textarea>
        <div class="status" id="status">상태: 라이브러리 로드 중...</div>
    </div>

    <!-- 호환성 충돌이 전혀 없는 범용 Firebase CDN 로드 방식 -->
    <script src="gstatic.com"></script>
    <script src="gstatic.com"></script>

    <script>
        const statusDiv = document.getElementById('status');
        const textarea = document.getElementById('sharedText');
        let isTyping = false;

        // 라이브러리가 정상 로드되었는지 즉각 점검하는 예외처리
        if (typeof firebase === 'undefined') {
            statusDiv.innerText = "❌ 라이브러리 로드 차단됨 (네트워크/보안 문제)";
            statusDiv.style.color = "#ff3b30";
        } else {
            statusDiv.innerText = "상태: 서버 연결 시도 중...";
            
            // 제공해주신 싱가포르 서버 정보 연동
            const firebaseConfig = {
                apiKey: "AIzaSyD4-ZmPnxvPDmpJ0kukQUa3VglmysBA5MA",
                authDomain: "test-61c65.firebaseapp.com",
                databaseURL: "firebasedatabase.app",
                projectId: "test-61c65",
                storageBucket: "test-61c65.firebasestorage.app",
                messagingSenderId: "389013854387",
                appId: "1:389013854387:web:fe6d27f87878b7aeb578c6"
            };

            // 전역 인스턴스로 안전하게 앱 초기화
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            const textRef = db.ref('shared_note/text');

            // 1. 서버 데이터 변경 실시간 감시 수신기
            textRef.on('value', (snapshot) => {
                if (!isTyping) {
                    const data = snapshot.val();
                    textarea.value = data || "";
                    statusDiv.innerText = "상태: 실시간 동기화 완료 ✅";
                    statusDiv.style.color = "#34c759";
                }
            }, (error) => {
                statusDiv.innerText = "🚨 접근 거부 오류! 파이어베이스 '규칙'이 테스트 모드가 아닙니다: " + error.message;
                statusDiv.style.color = "#ff3b30";
            });

            // 2. 타이핑 발생 시 데이터베이스 전송기
            textarea.addEventListener('input', (e) => {
                isTyping = true;
                statusDiv.innerText = "상태: 입력 내용 전송 중...";
                statusDiv.style.color = "#ff9500";
                
                textRef.set(e.target.value)
                    .then(() => { 
                        isTyping = false; 
                    })
                    .catch((error) => { 
                        statusDiv.innerText = "전송 실패: " + error.message; 
                        statusDiv.style.color = "#ff3b30";
                    });
            });
        }
    </script>
</body>
</html>
