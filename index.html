<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초간단 모바일 PC 연동</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background: #fafafa; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); text-align: center; }
        textarea { width: 100%; height: 180px; margin: 15px 0; padding: 12px; box-sizing: border-box; font-size: 16px; border: 2px solid #007bff; border-radius: 8px; resize: none; }
        .status { font-size: 14px; font-weight: bold; color: #28a745; }
        .info { font-size: 12px; color: #666; background: #eee; padding: 8px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📱 모바일 ⇄ 💻 PC 실시간 메모장</h2>
        <p class="info">수동 새로고침 없이 양쪽 기기를 동시에 켜놓고 입력해 보세요.</p>
        
        <textarea id="box" placeholder="여기에 아무 내용이나 타이핑해 보세요..."></textarea>
        
        <div class="status" id="statusText">● 실시간 연결망 연결 중...</div>
    </div>

    <script>
        // 🌐 오류를 유발하는 변수 기호를 완전히 제거하고 고정형 주소로 직접 매립
        const subscribeURL = "ntfy.sh"; 
        const publishURL = "ntfy.sh";

        const eventSource = new EventSource(subscribeURL);
        const box = document.getElementById('box');
        const statusText = document.getElementById('statusText');
        let typingTimer;

        // 서버 연결 성공 시 작동
        eventSource.onopen = () => {
            statusText.innerText = "● 실시간 연결망 가동 중 (정상)";
            statusText.style.color = "#28a745";
        };

        // 1. 상대방 기기에서 입력된 메시지를 실시간 수신 및 해석
        eventSource.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                // 내가 현재 텍스트 상자를 클릭해서 입력 중이 아닐 때만 글자 동기화
                if (document.activeElement !== box && data.message !== undefined) {
                    box.value = data.message;
                }
            } catch(e) {
                // 단순 시스템 메시지는 무시합니다.
            }
        };

        // 2. 내가 글을 타이핑할 때 서버로 즉시 전송
        box.addEventListener('input', (e) => {
            clearTimeout(typingTimer);
            statusText.innerText = "● 데이터 전송 중...";
            statusText.style.color = "#ff9500";
            
            typingTimer = setTimeout(() => {
                fetch(publishURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain; charset=utf-8' },
                    body: e.target.value
                }).then(() => {
                    statusText.innerText = "● 실시간 연결망 가동 중 (정상)";
                    statusText.style.color = "#28a745";
                });
            }, 250); // 0.25초 타이핑 지연 디바운싱 적용
        });
    </script>
</body>
</html>
